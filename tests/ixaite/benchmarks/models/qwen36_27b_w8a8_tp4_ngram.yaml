schema_version: 1
slug: qwen36_27b_w8a8_tp4_ngram

# ngram spec=3 variant of qwen36_27b_w8a8_tp4. Default W8A8 serve matches
# ixformer and never hits gdn_spec_delta_update; this profile is the spec
# comparison / e2e.ops coverage for that op. Same checkpoint and matrix.
l2:
  gdn_spec_delta_update:
    head_k_dim: 128
    head_v_dim: 128
    num_k_heads: 4
    num_v_heads: 12
    shapes:
      - [1, 2]
      - [8, 2]
      - [1, 4]
      - [8, 4]

