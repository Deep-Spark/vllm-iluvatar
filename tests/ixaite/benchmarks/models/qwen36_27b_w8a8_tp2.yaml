schema_version: 1
slug: qwen36_27b_w8a8_tp2

# Qwen3.6-27B-W8A8 TP=2. Hidden=5120; GDN-out K is 6144/2=3072, not hidden/2=2560.
# MLP / full-attn qkv/o_proj are W8A8 (L2 w8a8 + silu_and_mul + quant).
# Attention L2 is the full-attn shard (Hq=12, Hkv=2, D=256);
# reshape_and_cache_flash is that same Hkv=2 writer; linear L2 is GDN + lm_head.
# Default e2e serve matches ixformer (no speculative decode). ngram spec=3 is
# qwen36_27b_w8a8_tp2_ngram -- default serve never hits gdn_spec_delta_update.
l2:
  attention:
    batch: 1
    contexts: [128, 177, 256, 352, 512, 1024, 1169, 2048, 16384, 131072]
    prefill_contexts: [128, 177, 256, 352, 512, 1024, 1169, 2048, 16384]
    decode_contexts: [128, 177, 256, 352, 512, 1024, 1169, 2048, 16384, 131072]
    head_dim: 256
    num_kv_heads: 2
    num_query_heads: 12
    page_size: 16
  reshape_and_cache_flash:
    head_dim: 256
    num_kv_heads: 2
    page_size: 16
  embedding_gather:
    hidden_size: 5120
    num_tokens: [1, 8, 32, 128, 256, 512, 1024, 2048]
    vocab_size: 248320
  # GDN conv is column-sharded: conv_dim = (2*Hk*Dk + Hv*Dv) / TP with the
  # global Hk=16, Hv=48, Dk=Dv=128, so 10240/2. Not hidden/2 and not the
  # 9B 4096.
  causal_conv1d_fn:
    dim: 5120
    width: 4
  causal_conv1d_update:
    dim: 5120
    width: 4
  # GDN shard: global Hk=16, Hv=48, Dk=Dv=128. TP2 is 8/24, not the 9B 16/32.
  # rms_norm_gated is [T, Hv, Dv], not hidden 5120.
  fused_post_conv_prep:
    head_k_dim: 128
    head_v_dim: 128
    l2norm_min_t: 512
    num_k_heads: 8
    num_v_heads: 24
  chunk_gated_delta_rule:
    head_k_dim: 128
    head_v_dim: 128
    lengths:
      - [512]
      - [512, 1536]
    num_k_heads: 8
    num_v_heads: 24
  gdn_packed_decode:
    head_k_dim: 128
    head_v_dim: 128
    num_k_heads: 8
    num_tokens: [1, 8, 128]
    num_v_heads: 24
  gdn_spec_delta_update:
    head_k_dim: 128
    head_v_dim: 128
    num_k_heads: 8
    num_v_heads: 24
    shapes:
      - [1, 2]
      - [8, 2]
      - [1, 4]
      - [8, 4]
  rms_norm_gated:
    dim: 128
    heads: 24
  # Gate multiplies attn_output before o_proj. Last dim is the TP-local
  # Hq*D = 12*256 = 3072, not hidden 5120. 9B's 4096 is 16*256.
  attn_output_sigmoid_gate:
    hidden_size: 3072
  # Full-attn shard: global Hq=24, Hkv=4, D=256, rotary_dim=64, GQA=6.
  fused_qk_rmsnorm_rope_gate:
    cache_rows: 4096
    head_dim: 256
    num_kv_heads: 2
    num_query_heads: 12
    rotary_dim: 64
  gemma_rms_norm:
    hidden_size: 5120
  linear:
    gdn_in_proj_qkvz:
      K: 5120
      N: 8192
      bias: false
      tags: [gemm, decode, prefill, gdn, tp2]
    gdn_in_proj_ba:
      K: 5120
      N: 48
      bias: false
      tags: [gemm, decode, prefill, gdn, tp2]
    gdn_out_proj:
      K: 3072
      N: 5120
      bias: false
      tags: [gemm, decode, prefill, gdn, tp2]
    lm_head:
      K: 5120
      N: 124160
      bias: false
      max_t: 256
      tags: [gemm, decode, lm_head, tp2]
  # MLP / full-attn qkv/o_proj are W8A8. TP-local silu width is 17408/2.
  silu_and_mul:
    d: 8704
  fused_add_rms_norm:
    hidden_size: 5120
  # Activation quant sees each W8A8 linear's in_features (K), not N.
  # qkv N is (Hq + 2*Hkv + Hq)*D: the extra Hq is the fused sigmoid gate.
  scaled_int8_quant:
    hidden_sizes: [5120, 3072, 8704]
  distributed:
    hidden_size: 5120
    num_tokens: [1, 8, 128, 256]
  w8a8:
    attn_qkv_proj:
      K: 5120
      N: 7168
      bias: false
      tags: [gemm, decode, prefill, attn, tp2]
    attn_o_proj:
      K: 3072
      N: 5120
      bias: false
      tags: [gemm, decode, prefill, attn, tp2]
    mlp_gate_up_proj:
      K: 5120
      N: 17408
      bias: false
      tags: [gemm, decode, prefill, mlp, tp2]
    mlp_down_proj:
      K: 8704
      N: 5120
      bias: false
      tags: [gemm, decode, prefill, mlp, tp2]

e2e:
  ops:
    - silu_and_mul
    - linear
    - w8a8
    - scaled_int8_quant
    - embedding_gather
    - distributed
    - rms_norm_gated
    - fused_add_rms_norm
    - gemma_rms_norm
    - reshape_and_cache_flash
    - causal_conv1d_fn
    - causal_conv1d_update
    - gdn_post_conv_prep
    - gdn_chunk
    - gdn_packed_decode
    - fused_qk_rmsnorm_rope_gate
    - attn_output_sigmoid_gate
    - flash_attn
  env: {}
  serve_args:
    - --tensor-parallel-size
    - "2"
    - --trust-remote-code
    - --max-model-len
    - "4096"
    - --limit-mm-per-prompt
    - '{"image":0,"video":0}'
    - --compilation-config
    - '{"cudagraph_mode":"FULL_DECODE_ONLY","mode":0}'
  startup_timeout_s: 3600
  warmup_requests: 32
  correctness:
    kind: tp_graph_vs_eager
    prompt: Count from one to forty in words, separated by commas.
    temperature: 0
    max_tokens: 64
    random_seed: 0
    repeats: 4
    request_timeout_s: 600
  workloads:
    - id: bs1_128_128
      input_len: 128
      max_concurrency: 1
      num_prompts: 32
      output_len: 128
    - id: bs8_128_128
