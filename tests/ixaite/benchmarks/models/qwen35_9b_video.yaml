# SPDX-License-Identifier: Apache-2.0
# Qwen3.5-9B TP=1 short-video correctness profile.
#
# This profile is separate from qwen35_9b_vision so video encoder memory and
# temporal tokens do not move the image throughput baseline. It runs one
# deterministic greedy probe against baseline and ixaite; it is not a video
# throughput or long-context benchmark.
schema_version: 1
slug: qwen35_9b_video

l2:
  video_evs:
    hidden_size: 3584
    grids:
      - [2, 28, 28]
    pruning_rates: [0.5]

e2e:
  # These are the already-routed ops that the video request must exercise.
  # Conv3D uses the plugin matmul path. Video pruning stays disabled, and the
  # community video embedding post-process is outside the provider router.
  ops:
    - layer_norm
    - linear
    - video_evs
  env: {}
  serve_args:
    - --tensor-parallel-size
    - "1"
    - --trust-remote-code
    - --enforce-eager
    - --max-model-len
    - "8192"
    - --limit-mm-per-prompt
    - '{"image":0,"video":1}'
    - --video-pruning-rate
    - "0.5"
    - --video-pruning-method
    - evs
  startup_timeout_s: 1800
  warmup_requests: 0
  correctness:
    kind: video_greedy_exact
    prompt: Describe this video in one sentence.
    temperature: 0
    max_tokens: 32
    random_seed: 0
    # random-mm maps frames > 1 to the video_url chat modality.
    video_bucket: [448, 448, 4]
    request_timeout_s: 600
    provider_notes:
      conv3d: plugin matmul CUDA path
      video_postprocess: ixaite EVS retention mask; community embedding assembly
