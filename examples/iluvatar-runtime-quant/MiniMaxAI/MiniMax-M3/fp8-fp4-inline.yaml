# MiniMaxAI/MiniMax-M3 runtime quant（native BF16 checkpoint）
# 开源权重：https://huggingface.co/MiniMaxAI/MiniMax-M3
#
# 该 checkpoint 没有 quantization_config，必须同时传 --quantization ilu_runtime：
#
#   vllm serve /twodata/models/MiniMax-M3 \
#     --quantization ilu_runtime \
#     --config examples/iluvatar-runtime-quant/MiniMaxAI/MiniMax-M3/fp8-fp4-inline.yaml \
#     --tensor-parallel-size 4 --enable-expert-parallel --trust-remote-code
#
# Linear（attention / dense MLP / shared expert）：Qwen3.8 的
# IluFp8PerChannelOnlineLinearMethod，native BF16 -> per-channel FP8。
# Routed experts：GLM-5.2 的 weight_load 骨架，native BF16 -> ix30 FP4
# （先按 128x128 块转成 FP8 再 pack；峰值只有一个 expert 的 BF16）。
#
# 未列进 targets 的模块保持 BF16：embedding、lm_head、router gate、vision。
additional-config:
  ilu_quant:
    source: inline
    schema_version: 1
    enabled: true
    applies_to:
      model_types: [minimax_m3_text]
      quant_methods: [ilu_runtime]
    ignore: []
    config_groups:
      minimax_m3_bf16_linear_to_fp8:
        priority: 100
        targets:
          - 're:.*\.self_attn\.(?:qkv_proj|o_proj)$'
          - 're:.*\.mlp\.(?:gate_up_proj|down_proj)$'
          - 're:.*\.block_sparse_moe\.shared_experts\.(?:gate_up_proj|down_proj)$'
        require:
          original_disposition: ignored
          checkpoint_dtypes: [bfloat16]
        weights:
          source:
            format: native
            dtypes: [bfloat16]
          target:
            format: fp8
            dtype: float8_e4m3fn
            strategy: channel
          loading:
            mode: transform
            stage: process_weights_after_loading
        input_activations:
          num_bits: 8
          type: float
          strategy: token
          dynamic: true
        output_activations: null
        iluvatar:
          method: IluFp8PerChannelOnlineLinearMethod
          gemm_format: TN
          shape_mismatch_policy: fallback_original
      minimax_m3_bf16_moe_to_ix30_fp4:
        priority: 90
        targets:
          - 're:.*block_sparse_moe\.experts(?:\.routed_experts)?$'
        require:
          original_disposition: ignored
          checkpoint_dtypes: [bfloat16]
        weights:
          source:
            format: native
            dtypes: [bfloat16]
          target:
            format: ix30-fp4
            dtype: uint8
            strategy: group
            group_size: 256
            scale_format: running_acc
          loading:
            mode: transform
            stage: weight_load
        input_activations:
          num_bits: 8
          type: float
          strategy: token
          dynamic: true
        output_activations: null
        iluvatar:
          method: IluFp16ToFp4OnlineMoEMethod
          converter_backend: auto
          max_pending_shards: 8
          fp8_block_shape: [128, 128]
