e2e:
  ops:
    - linear
  env: {}
  serve_args:
    - --tensor-parallel-size
    - "2"
    - --trust-remote-code
    - --max-model-len
    - "8192"
    - --limit-mm-per-prompt
    - '{"image":0,"video":0}'
    - --compilation-config
    - '{"cudagraph_mode":"FULL","mode":0}'
  startup_timeout_s: 1800
  warmup_requests: 10
  workloads:
    - id: bs1_128_128
      input_len: 128
      max_concurrency: 1
      num_prompts: 40
      output_len: 128
  # Decode runs inside a captured graph (cudagraph_mode FULL). A collective
  # that advances its barrier flag on the host still times, but the replay
  # returns a stale sum. This probe catches that without a second model.
  correctness:
    kind: tp_graph_vs_eager
    prompt: Count from one to forty in words, separated by commas.
    temperature: 0
    max_tokens: 64
    random_seed: 0
    repeats: 4
    request_timeout_s: 600
