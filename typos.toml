# Repo-level config for crate-ci/typos (pre-commit `typos` hook).
#
# Some identifiers we keep verbatim from upstream (HuggingFace
# transformers, vLLM) contain sub-tokens that typos flags as misspellings.
# Map them to themselves so typos accepts them as valid words instead of
# forcing a rename of standard identifiers like ``grid_thw``.

[default.extend-words]
# ``grid_thw`` is the standard HuggingFace vision-model identifier for the
# (temporal, height, width) grid; ``thw`` is not a typo.
thw = "thw"
# ``spec_token_indx`` / ``non_spec_token_indx`` are existing ILU variable
# names (short for "index"); ``indx`` is not a typo we want to force-rename.
indx = "indx"
# ``UE8M0`` is the unsigned exponent-only 8-bit / 0-mantissa FP8 layout
# (used by fp8_ds_mla); ``UE`` is not a typo.
ue = "ue"
# ``mis-`` prefix (mis-unpacked / mis-sized / mis-aligned, meaning "wrongly")
# is split by typos on the hyphen and the bare ``mis`` flagged as a typo.
mis = "mis"
# ``arange`` is the standard PyTorch API name (``torch.arange``); variables like
# ``token_arange_p1`` / ``decode_token_arange_p1_buffer`` derive from it. Not a
# typo of ``arrange``.
arange = "arange"
# ``ba`` is the GDN (gated delta net) b/a decomposition tensor: ``in_proj_ba``
# projects to it and ``split_ba`` splits it into the ``b`` and ``a`` gates. Not
# a typo of ``by`` / ``be``.
ba = "ba"
# ``MOEW`` is the ILU MoE W16A16 expert-class acronym (e.g. ``IluMOEW16A16``);
# not a typo of ``MEOW`` / ``MORE`` / ``MOW``.
moew = "moew"
