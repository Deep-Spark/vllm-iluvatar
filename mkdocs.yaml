site_name: vLLM-Iluvatar
site_url: !ENV [READTHEDOCS_CANONICAL_URL, "http://localhost:8000/"]
repo_url: https://github.com/Deep-Spark/vllm-iluvatar
edit_uri: edit/main/docs/

exclude_docs: |
  *.inc.md
  *.template.md
  # 构建资源不是文档。hooks/ 与 overrides/ 放在 docs/mkdocs/ 下（与上游一致），
  # 但 MkDocs 会把 docs/ 里的非 md 文件当静态资源原样复制进 site/，
  # 不排除就是源码泄露（上游 docs.vllm.ai 现在就在泄露，别学）。
  mkdocs/hooks/*
  mkdocs/overrides/*
  # RFC 归档只留在仓库里供决策追溯，不发布到站点。
  rfcs/

validation:
  links:
    absolute_links: relative_to_docs
    anchors: warn
    unrecognized_links: warn

theme:
  name: material
  custom_dir: docs/mkdocs/overrides
  language: zh
  icon:
    repo: fontawesome/brands/github
  palette:
    # Follow system preference
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: 切换到浅色模式 / Switch to light mode
    # Light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: white
      toggle:
        icon: material/brightness-7
        name: 切换到深色模式 / Switch to dark mode
    # Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      toggle:
        icon: material/brightness-2
        name: 跟随系统 / Switch to system preference
  features:
    - content.action.edit
    - content.code.copy
    - content.tabs.link
    - navigation.instant
    - navigation.instant.progress
    - navigation.tracking
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.path
    - search.highlight
    - search.share
    - toc.follow

hooks:
  - docs/mkdocs/hooks/remove_announcement.py
  - docs/mkdocs/hooks/url_schemes.py
  - docs/mkdocs/hooks/doc_sources.py
  - docs/mkdocs/hooks/release_navigation.py
  - docs/mkdocs/hooks/doc_titles.py

plugins:
  - search:
      lang:
        - zh
        - en
  - awesome-nav
  - glightbox
  - minify:
      minify_html: true
      cache_safe: true
      # Only minify our own custom assets, not plugin-provided bundles
      # (those are already minified). Add entries here when we add custom files.
      css_files:
        - mkdocs/stylesheets/extra.css

markdown_extensions:
  - attr_list
  - md_in_html
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - toc:
      permalink: true
      # Chinese headings lose every CJK character under the default slugify,
      # so anchors like #3-配置入口 become #3 and in-page links break.
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds: {case: lower}

extra_css:
  - mkdocs/stylesheets/extra.css

extra:
  generator: false

# README.md generates as index.html, available at /index.html (RTD-friendly).
use_directory_urls: false
