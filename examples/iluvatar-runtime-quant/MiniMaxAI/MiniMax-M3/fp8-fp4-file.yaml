# MiniMaxAI/MiniMax-M3 runtime quant（file 模式）
#
# 内容与 fp8-fp4-inline.yaml 等价。同样需要 --quantization ilu_runtime。
#
# file 必须是所有 worker 可见的绝对路径。部署前：
#   1. 把同目录 fp8-fp4-runtime.json 放到目标机器
#   2. sha256sum fp8-fp4-runtime.json，把结果写成 sha256:<64 位小写 hex>
#   3. 填写下面的 file 与 sha256
# 修改 JSON 后必须重新计算 sha256。
additional-config:
  ilu_quant:
    source: file
    file: /path/to/vllm-iluvatar/examples/iluvatar-runtime-quant/MiniMaxAI/MiniMax-M3/fp8-fp4-runtime.json
    sha256: sha256:93f44ddf5e3e47c106dec384a829c7e9e538451580ee16b84427e3cd0dab0b1d
